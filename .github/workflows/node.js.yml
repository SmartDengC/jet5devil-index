# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["ci_preview"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          # version: 10
          run_install: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          # cache-dependency-path: subdir/package-lock.json
          node-version: "20.x"
          # cache: "pnpm"

      # - run: touch pnpm-lock.yaml
      - run: pnpm install --no-lockfile

      - run: pnpm wiki:build
      # - run: pnpm iron:build
      # - run: pnpm sci:build

      - name: Setup ssh
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}

      - name: push files to Aliyun Server
        run: |
          scp -r wiki/.vuepress/dist/* ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_TARGET_FOR_WIKI }}

      # - name: Deploy wiki to Server
